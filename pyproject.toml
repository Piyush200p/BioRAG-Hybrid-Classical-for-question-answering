[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag-hybrid-evaluation1"
version = "0.1.0"
description = "Transparent biomedical hybrid retrieval and evidence selection prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
embedding = ["torch>=2.1", "transformers>=4.40,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
